steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_IMAGE:$COMMIT_SHA
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_IMAGE:latest
      - --build-arg
      - VITE_AUTH0_DOMAIN=$_VITE_AUTH0_DOMAIN
      - --build-arg
      - VITE_AUTH0_CLIENT_ID=$_VITE_AUTH0_CLIENT_ID
      - --build-arg
      - VITE_AUTH0_AUDIENCE=$_VITE_AUTH0_AUDIENCE
      - --build-arg
      - VITE_API_BASE_URL=$_VITE_API_BASE_URL
      - .

  - name: gcr.io/cloud-builders/kubectl
    args:
      - set
      - image
      - deployment/$_DEPLOYMENT
      - $_CONTAINER=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_IMAGE:$COMMIT_SHA
    env:
      - CLOUDSDK_COMPUTE_REGION=$_REGION
      - CLOUDSDK_CONTAINER_CLUSTER=$_CLUSTER

images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_IMAGE:$COMMIT_SHA
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/$_IMAGE:latest

substitutions:
  _REGION: us-central1
  _REPOSITORY: coding-agent-project
  _IMAGE: coding-agent-frontend
  _CLUSTER: codingagent
  _DEPLOYMENT: coding-agent-frontend
  _CONTAINER: coding-agent-frontend
  _VITE_AUTH0_DOMAIN: dev-xd0ga8sh216d7yr0.us.auth0.com
  _VITE_AUTH0_CLIENT_ID: lkJpzE0ZWllSA8XmsrlOsGtv9nAZcKrD
  _VITE_AUTH0_AUDIENCE: https://fastapibackend
  _VITE_API_BASE_URL: https://codingagent.sadineni.in/coding-agent

options:
  logging: CLOUD_LOGGING_ONLY
